<!doctype html>
<html><head><meta charset="utf-8"><title>Kapsel Treppe</title>
<style>html,body{margin:0;background:#222}canvas{width:270px}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { buehne, gold, stein, glattesKapselNetz } from '/lib/welt.js';
import { neueRunde, TREPPE, STUFEN, FPS, RUNDE_SEK, konfiguriere } from '/szenen/kapsel-treppe.js';
import { waehleVariante } from '/lib/variante.js';
const q = new URLSearchParams(location.search);
const schnell = q.get('schnell') === '1';
const V = q.get('seed') ? waehleVariante(q.get('seed')) : {};
konfiguriere(V, schnell ? { fps: 30 } : {});
const SK = TREPPE.stufen / 8;   // Kamera mit der Treppengröße mitwachsen lassen

const b = buehne({ farbe: V.hintergrund?.farbe ?? '#bcc3cc', kamera: [1.25 * SK, 3.3 * SK, 7.0 * SK], ziel: [0.12, 0.8 * SK, 1.45 * SK], fov: 31, fein: schnell ? 1 : 1.35, mitAO: !schnell });
document.body.appendChild(b.aus);
b.sonne.position.set(-3, 7, 4);

// Steintreppe: jede Stufe ein Block mit leicht abgerundeter Kante
const { RoundedBoxGeometry } = await import('three/addons/geometries/RoundedBoxGeometry.js');
const steinMat = stein((V.steinSaat ?? 51), { sprenkel: 0.6 });
for (let k = 0; k < TREPPE.stufen; k++) {
  const top = (TREPPE.stufen - k) * TREPPE.hoehe;
  const m = new THREE.Mesh(new RoundedBoxGeometry(TREPPE.breite, top, TREPPE.tiefe, 4, 0.012), steinMat);
  m.position.set(0, top / 2, k * TREPPE.tiefe + TREPPE.tiefe / 2);
  m.castShadow = m.receiveShadow = true;
  b.szene.add(m);
}

const goldMat = gold(V.material ?? {}); goldMat.side = THREE.DoubleSide;
let netze = [], runde = null, rundeNr = -1;
function baueNetze() {
  netze.forEach(n => b.szene.remove(n.mesh));
  netze = runde.kapseln.map((_, i) => {
    const o = runde.oberflaeche(i);
    const netz = glattesKapselNetz(o.ns, o.nv, 3);
    const mesh = new THREE.Mesh(netz.geo, goldMat);
    mesh.castShadow = mesh.receiveShadow = true;
    b.szene.add(mesh);
    return { netz, mesh };
  });
}
function aktualisiere() {
  netze.forEach(({ netz }, i) => { const o = runde.oberflaeche(i); netz.aktualisiere(o.ringe, o.spL, o.spR); });
}

const proRunde = Math.round(FPS * RUNDE_SEK);
const PROBEN = schnell ? 2 : 3;
window.GESAMT = proRunde * STUFEN.length;
window.FPS = FPS;
window.TONVORLAGE = 'kapsel';
const kamStart = b.cam.position.clone();
window.bild = (f, nurPhysik = false) => {
  const nr = Math.floor(f / proRunde);
  if (nr !== rundeNr) { rundeNr = nr; runde = neueRunde(STUFEN[nr]); baueNetze(); }
  const halb = runde.sub / 2, je = halb / PROBEN;
  runde.schritte(halb);
  if (nurPhysik) { runde.schritte(halb); const r = runde.aufprall(); return { aufprall: r.a, kontakte: r.k, runde: nr, neu: f % proRunde === 0 }; }
  const v = f / window.GESAMT;
  b.cam.position.set(kamStart.x - 0.15 * v, kamStart.y, kamStart.z - 0.3 * v);
  b.cam.lookAt(0.12, 0.8 * SK, 1.45 * SK);
  b.mischeAnfang();
  for (let s = 0; s < PROBEN; s++) { runde.schritte(je); aktualisiere(); b.mischeBild(); }
  const r = runde.aufprall();
  const jpg = b.mischeEnde(`${STUFEN[nr]}% SOFT`);
  return { jpg, aufprall: r.a, kontakte: r.k, runde: nr, neu: f % proRunde === 0 };
};
window.BEREIT = true;
</script>
</body></html>
